<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>松本交通レポート</title>
  <meta
    name="description"
    content="道路や交通の気づきを地域のみんなで共有する、まちの交通レポートです。"
  >
  <meta name="theme-color" content="#17181e">
  <link rel="stylesheet" href="style.css">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >
</head>

<body>
  <div class="home-screen" id="home-screen">
    <header class="home-header">
      <a class="brand home-brand" href="index.html" aria-label="松本交通レポート ホーム">
        <span class="brand-icon" aria-hidden="true">
          <i class="fa-solid fa-map-location-dot"></i>
        </span>
        <span class="brand-text">
          <strong>松本交通レポート</strong>
          <span>MATSUMOTO TRAFFIC REPORT</span>
        </span>
      </a>
    </header>

    <main class="home-content">
      <section class="home-hero" aria-labelledby="home-title">
        <p class="eyebrow">YOUR COMMUNITY, YOUR VOICE</p>
        <h1 id="home-title">松本の気づきを、<br>みんなで共有しよう。</h1>
        <p class="home-description">
          道路や交通で気になったことを地図に投稿し、地域のみんなで確認できます。
        </p>
      </section>

      <nav class="home-actions" aria-label="サイトのメニュー">
        <a class="primary-button home-map-button" href="map.html">
          <i class="fa-solid fa-map" aria-hidden="true"></i>
          地図で確認する
          <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
        </a>
        <!-- 将来のホーム画面メニューは、このnav内にリンクを追加してください。 -->
      </nav>

      <section class="home-statistics" aria-label="地域の投稿状況">
        <div class="home-stat-card">
          <span class="stat-label">総投稿数</span>
          <strong id="total-report-count">0</strong>
          <span class="stat-unit">件</span>
        </div>
        <div class="home-stat-card">
          <span class="stat-label">確認中</span>
          <strong id="pending-report-count">0</strong>
          <span class="stat-unit">件</span>
        </div>
        <div class="home-stat-card">
          <span class="stat-label">解決済み</span>
          <strong id="resolved-report-count">0</strong>
          <span class="stat-unit">件</span>
        </div>
      </section>

      <p class="home-note" id="home-data-message" role="status" aria-live="polite">
        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
        緊急の危険がある場合は、警察や道路管理者などへご連絡ください。
      </p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
  <script src="supabase-config.js"></script>
  <script src="home.js"></script>
</body>
</html>
