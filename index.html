
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TFR - Maintenance</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #101827;
      color: #f3f4f6;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .panel {
      max-width: 520px;
      padding: 42px 28px;
      border: 1px solid #374151;
      border-radius: 16px;
      background: #182235;
    }
    .icon { font-size: 48px; }
    h1 { margin: 20px 0 12px; }
    p { color: #cbd5e1; line-height: 1.8; }
    .status {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 14px;
      border-radius: 20px;
      background: #374151;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="icon">🔧</div>
    <h1>Maintenance in Progress</h1>
    <p>
      TFR is temporarily unavailable while we carry out
      maintenance and improvements.
    </p>
    <p>Please check back later. Thank you for your patience.</p>
    <div class="status">● Under Maintenance</div>
  </main>
</body>
</html>
